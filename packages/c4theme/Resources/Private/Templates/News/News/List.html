<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
	  xmlns:n="http://typo3.org/ns/GeorgRinger/News/ViewHelpers"
	  data-namespace-typo3-fluid="true">
<f:layout name="General" />
<!--
	=====================
		Templates/News/List.html
-->

<f:section name="content"> 
	<!--TYPO3SEARCH_end-->
	<f:if condition="{news}">
		<f:then>   

			<f:if condition="{settings.templateLayout} == 1">
				<div class="news-list-view" id="news-container-{contentObjectData.uid}">
					
					<f:if condition="{settings.hidePagination}">
						<f:then>
							<div class="row">
								<f:for each="{news}" as="newsItem" iteration="iterator">
									<f:render partial="List/Homepage" arguments="{newsItem: newsItem,settings:settings,iterator:iterator}" />
								</f:for>
							</div>
						</f:then>
						<f:else>
							<div class="row">
								<f:for each="{pagination.paginator.paginatedItems}" as="newsItem" iteration="iterator">
									<f:render partial="List/Homepage" arguments="{newsItem: newsItem,settings:settings,iterator:iterator}" />
								</f:for>
								</div>
								<f:if condition="{settings.list.paginate.insertBelow}">
									<f:render partial="List/Pagination" arguments="{pagination: pagination.pagination, paginator: pagination.paginator}" />
								</f:if>

						</f:else>
					</f:if>
				
				</div>
			</f:if>
			<f:if condition="{settings.templateLayout} == 2">
				<div class="news-list-view" id="news-container-{contentObjectData.uid}">
					
					<f:if condition="{settings.hidePagination}">
						<f:then>
							<div class="row">
								<table class="table"> 
								<f:for each="{news}" as="newsItem" iteration="iterator">
									<f:render partial="List/Liste" arguments="{newsItem: newsItem,settings:settings,iterator:iterator}" />
								</f:for>
								</table>
							</div>
						</f:then>
						<f:else>
							<div class="row">
								<table class="table"> 
								<f:for each="{pagination.paginator.paginatedItems}" as="newsItem" iteration="iterator">
									<f:render partial="List/Liste" arguments="{newsItem: newsItem,settings:settings,iterator:iterator}" />
								</f:for>
								</table>
								</div>
								<f:if condition="{settings.list.paginate.insertBelow}">
									<f:render partial="List/Pagination" arguments="{pagination: pagination.pagination, paginator: pagination.paginator}" />
								</f:if>

						</f:else>
					</f:if>
				
				</div>
			</f:if>		 
			<f:if condition="{settings.templateLayout} == 3">
					<div class="news-list-view" id="news-container-{contentObjectData.uid}">
						<div class="card-group-element card-group-element-align-center card-group-element-columns-3"> 
						<f:if condition="{settings.hidePagination}">
							<f:then>
								<div class="row">

									<f:for each="{news}" as="newsItem" iteration="iterator">
										<f:render partial="List/Card" arguments="{newsItem: newsItem,settings:settings,iterator:iterator}" />
									</f:for>
								</div>
							</f:then>
							<f:else>
								<f:if condition="{settings.list.paginate.insertAbove}">
									<f:render partial="List/Pagination" arguments="{pagination: pagination.pagination, paginator: pagination.paginator}" />
								</f:if>
								<div class="row">
								<f:for each="{pagination.paginator.paginatedItems}" as="newsItem" iteration="iterator">
									<f:render partial="List/Card" arguments="{newsItem: newsItem,settings:settings,iterator:iterator}" />
								</f:for>
								</div>
								<f:if condition="{settings.list.paginate.insertBelow}">
									<f:render partial="List/Pagination" arguments="{pagination: pagination.pagination, paginator: pagination.paginator}" />
								</f:if>

							</f:else>
						</f:if>
					</div>
					</div>
			</f:if>
			 
		</f:then>
		<f:else>
			<div class="no-news-found">
				<f:translate key="list_nonewsfound" />
			</div>
		</f:else>
	</f:if>
	<!--TYPO3SEARCH_begin-->
</f:section>
</html>
