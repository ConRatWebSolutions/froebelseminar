<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<table class="tx-crbuchkatalog" >
	<tr>
		<td>
			<f:translate key="tx_crbuchkatalog_domain_model_eintrag.titel" />
		</td>
		<td>
		{eintrag.titel}
		</td>
	</tr>
	<tr>
		<td>
			<f:translate key="tx_crbuchkatalog_domain_model_eintrag.autor" />

			<f:translate key="tx_crbuchkatalog_domain_model_eintrag.pdf" />
		</td>

				<a href="{eintrag.pdf.originalResource.publicUrl}">

	<tr>
		<td>
