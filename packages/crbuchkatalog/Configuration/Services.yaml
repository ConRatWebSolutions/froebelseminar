services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Conrat\Crbuchkatalog\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Domain/Model/*'

  Conrat\Crbuchkatalog\Controller\:
    resource: '../Classes/Controller/'
    public: true
    tags: ['controller.service_arguments']

  Conrat\Crbuchkatalog\Domain\Repository\:
    resource: '../Classes/Domain/Repository/'
    public: true
