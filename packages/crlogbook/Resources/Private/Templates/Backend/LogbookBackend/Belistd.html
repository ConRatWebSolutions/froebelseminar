<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />

<f:section name="content">
    <div class="module-docheader">
        <div class="module-docheader-bar">
            <div class="module-docheader-bar-column-left">
                <h1 class="module-docheader-bar-title">Fahrtenbuch Übersicht</h1>
            </div>
        </div>
    </div>

    <div class="module-body">
        <div class="t3js-module-body">
        <f:flashMessages />
        
        <div class="form-section">
            <f:form id="myform" action="belistd" class="myform" name="dataSubmit" objectName="dataSubmit">
                <div class="form-group">
                    <label for="week">Kalenderwoche:</label>
                    <select id="select" name="dataSubmit[week]" class="form-control">
                        <f:format.raw>{options}</f:format.raw>
                    </select>
                </div>
                <div class="form-group">
                    <label for="year">Jahr:</label>
                    <select id="selecty" name="dataSubmit[year]" class="form-control">
                        <f:format.raw>{jahr}</f:format.raw>
                    </select>
                </div>
            </f:form>
            </div>
        </div>

        <div class="row">
            <div class="col-md-12">
                <div class="button-bar">
                    <div class="button-group">
                        <button class="btn btn-default" id="print-button">
                            <span class="t3-icon t3-icon-actions t3-icon-actions-document t3-icon-document-export-t3-icon-actions-document-export-t3-icon-document-export"></span>
                            Drucken
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div id="printtables">
            <h2>Fahrtenbuch KW {week} <span style="font-size:16px; font-weight:normal">{ersterTag} - {letzterTag}</span></h2>
            
            <div class="table-fit">
                <table class="table table-striped table-hover">
                    <thead class="thead-dark">
                        <tr>
                            <th scope="col">Datum</th>
                            <th scope="col">von - bis</th>
                            <th scope="col">Bemerkung / Grund</th>
                            <th scope="col">Fahrstrecke</th>
                            <th scope="col">Dozent</th>
                           
                        </tr>
                    </thead>
                    <tbody>
                        <f:for each="{logbooks}" as="logss">
                            <f:for each="{logss.data}" as="log">
                                <tr>
                                    <td><f:format.date format="d.m.Y">{log.datum}</f:format.date></td>
                                    <td>{log.von} ({log.start}) - {log.bis} ({log.ende})</td>
                                    <td>{log.bemerkung} {log.grund}</td>
                                    <td>{log.fahrstrecke} km</td>
                                    <td>{log.user.name}{log.username}</td>
                                    <td>
                                      
                                    </td>
                                </tr>
                            </f:for>
                            <tr class="table-info">
                                <td><strong>Gesamtkilometer</strong></td>
                                <td></td>
                                <td></td>
                                <td><strong>{logss.gesamt} km</strong></td>
                                <td></td>
                                <td></td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <link rel="stylesheet" href="{f:uri.resource(path: 'Css/Backend/logbook-backend.css', extensionName: 'crlogbook')}" />
    <script src="{f:uri.resource(path: 'JavaScript/Backend/logbook-backend.js', extensionName: 'crlogbook')}"></script>
</f:section>
</html>
