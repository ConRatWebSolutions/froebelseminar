services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Conrat\Crlogbook\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Domain/Model/*'

  Conrat\Crlogbook\Controller\:
    resource: '../Classes/Controller/'
    public: true
    tags: ['controller.service_arguments']


  Conrat\Crlogbook\Domain\Repository\:
    resource: '../Classes/Domain/Repository/'
    public: true
