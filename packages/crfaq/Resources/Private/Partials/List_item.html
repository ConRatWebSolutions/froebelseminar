<f:for each="{eintrags}" as="eintrag" iteration="iterator">	
    <div class="card">
        <div class="card-header" id="heading{eintrag.uid}">
            <h5 class="mb-0">
                <button class="btn btn-link" type="button" data-toggle="collapse" data-target="#collapse{eintrag.uid}" aria-expanded="false" aria-controls="collapse{eintrag.uid}">
                    {eintrag.frage}
                </button>
            </h5>
        </div>
        <div id="collapse{eintrag.uid}" class="collapse" aria-labelledby="heading{eintrag.uid}" data-parent="#accordion">
            <div class="card-body">
                <f:format.html>{eintrag.antwort}</f:format.html>
            </div>
        </div>
    </div>
</f:for>
